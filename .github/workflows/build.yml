name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Pas de gradlew dans le repo : Gradle est installé à la bonne version par l'action
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: red-rising-jar
          path: build/libs/*.jar
