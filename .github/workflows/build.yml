name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Cache Gradle ; la version (9.8.2) vient du wrapper du repo
      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v5
        with:
          name: red-rising-jar
          path: build/libs/*.jar
