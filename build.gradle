plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // JUnit seulement depuis Maven Central : Gradle n'interroge pas les serveurs Mojang pour ces groupes
    // (bloqués sur le réseau de l'école, et inutiles ici)
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex "org\\.(junit|opentest4j|apiguardian)(\\..*)?"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "redrising" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    // Tests en jeu automatisés (source set src/gametest, tâche runClientGameTest)
    configureTests {
        createSourceSet = true
        modId = "redrising-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}

dependencies {
    // 26.x n'est plus obfusqué : pas de ligne mappings, pas de modImplementation
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Tests unitaires de la logique pure (./gradlew test, lancés aussi par build)
    testImplementation platform("org.junit:junit-bom:5.14.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    // Variable locale : compatible avec le configuration cache de Gradle
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}
